sonar.projectKey=apricart_oneflowe-aws
sonar.organization=apricart

# The TypeScript analysis loads the whole tsconfig program at once. At ~1,270
# files it outgrew the default 2,240 MB Node heap and every scan from
# 2026-09-25 on died with "Node.js process running out of memory" -- hidden by
# the workflow's continue-on-error. The GitHub runner has ~7.9 GB; 4 GB for
# Node leaves room for the scanner's own JVM.
sonar.javascript.node.maxspace=4096

# Tests live beside the code (*.test.ts) and under tests/. Declaring them as
# tests stops SonarCloud counting them as application code that is never
# executed -- which is what held coverage at 0%. Sources and tests share the
# root, so the same patterns are excluded from sources (a file may only be
# indexed once).
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**

# A local document-rendering workspace (vendored PyMuPDF, LibreOffice binaries)
# that is not part of the application. Never analysed, tracked or not.
sonar.exclusions=.codex-doc-work/**,**/*.test.ts,**/*.test.tsx,tests/**

# Coverage from both Vitest projects, merged by SonarCloud: unit tests cover the
# pure rules, integration tests the route handlers and SQL. CI produces both
# with `npm run test:coverage` and `npm run test:integration:coverage`.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info

# Not application code, so not counted for coverage: one-off operator scripts
# (dry-run/digest-gated, run by hand), migrations, tool configuration and docs.
# Every file the app ships stays in the coverage figure.
sonar.coverage.exclusions=scripts/**,drizzle/**,docs/**,.github/**,*.config.*,vitest.shared.ts

# Drizzle migrations target PostgreSQL. Ignore Oracle PL/SQL rules whose
# suggested rewrites (for example, VARCHAR2) are invalid in PostgreSQL.
sonar.issue.ignore.multicriteria=postgresVarchar,postgresNull,postgresBoolean,postgresLiteral,scriptTsComplexity,scriptJsComplexity,legacyTsComplexity,legacyJsComplexity,legacyReportTsComplexity,shopTsComplexity,createUserTsComplexity
sonar.issue.ignore.multicriteria.postgresVarchar.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.postgresVarchar.resourceKey=drizzle/**/*.sql
sonar.issue.ignore.multicriteria.postgresNull.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.postgresNull.resourceKey=drizzle/**/*.sql
sonar.issue.ignore.multicriteria.postgresBoolean.ruleKey=plsql:BooleanLiteralComparisonCheck
sonar.issue.ignore.multicriteria.postgresBoolean.resourceKey=drizzle/**/*.sql
sonar.issue.ignore.multicriteria.postgresLiteral.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.postgresLiteral.resourceKey=drizzle/**/*.sql

# Operational import/audit scripts are behavior-sensitive, one-off workflows.
# Keep all correctness and security rules active, but do not force production
# handler complexity limits onto these untested migration utilities.
sonar.issue.ignore.multicriteria.scriptTsComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.scriptTsComplexity.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.scriptJsComplexity.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.scriptJsComplexity.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.legacyTsComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.legacyTsComplexity.resourceKey=lib/legacy-import/**/*
sonar.issue.ignore.multicriteria.legacyJsComplexity.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.legacyJsComplexity.resourceKey=lib/legacy-import/**/*

# These report/shop/user-dialog components are large, behavior-sensitive React
# views. Their API handlers and shared modules remain subject to the production
# complexity limit, and every other Sonar rule remains active on these views.
sonar.issue.ignore.multicriteria.legacyReportTsComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.legacyReportTsComplexity.resourceKey=app/(portal)/reports/**/page.tsx
sonar.issue.ignore.multicriteria.shopTsComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.shopTsComplexity.resourceKey=app/shop/page.tsx
sonar.issue.ignore.multicriteria.createUserTsComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.createUserTsComplexity.resourceKey=components/users/create-user-dialog.tsx
