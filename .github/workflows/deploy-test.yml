name: deploy-test

on:
  push:
    branches:
      - test

permissions:
  contents: read

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ---- SonarCloud scan (report only, never blocks) ----
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # ---- Trivy filesystem/dependency scan (report only) ----
      - name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: json
          output: trivy-fs-report.json

      - name: Trivy filesystem scan (readable table, for the report bundle)
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-fs-report.txt

      # ---- Snyk scan (report only) ----
      - name: Snyk Scan
        continue-on-error: true
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --json-file-output=snyk-report.json

      # ---- Build the Docker image ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEPLOY_AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build image
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          docker build -t "${ECR_REPOSITORY_URL}:test-${GITHUB_SHA}" .

      # ---- Trivy image scan (report only, the built image itself) ----
      - name: Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY_URL }}:test-${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-image-report.txt

      # ---- Upload all reports as downloadable artifacts ----
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-test-${{ github.sha }}
          path: |
            trivy-fs-report.json
            trivy-fs-report.txt
            trivy-image-report.txt
            snyk-report.json
          if-no-files-found: warn
          retention-days: 30

      # ---- Push to ECR (always runs now, regardless of scan findings) ----
      - name: Push image to ECR
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          docker push "${ECR_REPOSITORY_URL}:test-${GITHUB_SHA}"

      # ---- Deploy to staging via SSM, then wait for and verify the result ----
      - name: Deploy to staging
        env:
          DEPLOY_AWS_REGION: ${{ secrets.DEPLOY_AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          STAGING_EC2_INSTANCE_ID: ${{ secrets.STAGING_EC2_INSTANCE_ID }}
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URL%%/*}"
          if [ "$ECR_REGISTRY" = "$ECR_REPOSITORY_URL" ]; then
            echo "ECR_REPOSITORY_URL must include both the registry host and repository name" >&2
            exit 1
          fi

          REMOTE_SCRIPT=$(jq -nr \
            --arg region "$DEPLOY_AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg repository "$ECR_REPOSITORY_URL" \
            --arg commit "$GITHUB_SHA" \
            '[
                "#!/bin/bash",
                "set -Eeuo pipefail",
                "echo \"[deploy] Checking staging host and runtime configuration\"",
                "cd /home/ubuntu/app",
                "test -f docker-compose.yml",
                "test -f .env.production",
                "if ! sudo grep -Eq \"^[[:space:]]*NEXTAUTH_URL=[[:space:]]*[^[:alnum:]]*https://\" .env.production; then echo \"[deploy] NEXTAUTH_URL in /home/ubuntu/app/.env.production must use the public staging HTTPS URL\" >&2; exit 20; fi",
                "echo \"[deploy] Authenticating Docker to ECR\"",
                ("aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin " + $registry),
                "echo \"[deploy] Pulling the immutable staging image\"",
                ("sudo docker pull " + $repository + ":test-" + $commit),
                ("sudo sed -i -E \"s|^[[:space:]]*image:[[:space:]]*.*oneflowe-app:.*$|    image: " + $repository + ":test-" + $commit + "|\" docker-compose.yml"),
                ("sudo grep -Fq \"image: " + $repository + ":test-" + $commit + "\" docker-compose.yml"),
                "echo \"[deploy] Starting the Compose app service\"",
                "sudo docker compose up -d app",
                "attempt=0; while [ \"$attempt\" -lt 18 ]; do container_id=$(sudo docker compose ps -a -q app); running_id=$(sudo docker compose ps --status running -q app); echo \"[deploy] health attempt $((attempt + 1))/18\"; if [ -n \"$container_id\" ] && [ \"$container_id\" = \"$running_id\" ] && sudo docker exec \"$container_id\" node -e \"fetch(\\\"http://127.0.0.1:3000/api/v1/health\\\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"; then echo \"[deploy] Staging app is running and healthy\"; exit 0; fi; attempt=$((attempt + 1)); sleep 5; done; echo \"[deploy] App did not become healthy; Compose status and recent logs follow\" >&2; sudo docker compose ps -a >&2 || true; sudo docker compose logs --no-color --tail=200 app >&2 || true; exit 21"
              ] | join("\n")')

          # Validate the exact script locally, then encode it so SSM cannot
          # interpret shell or Go-template syntax as document parameters.
          printf '%s\n' "$REMOTE_SCRIPT" | /bin/bash -n
          REMOTE_SCRIPT_BASE64=$(printf '%s\n' "$REMOTE_SCRIPT" | base64 --wrap=0)
          REMOTE_COMMANDS=$(jq -cn \
            --arg payload "$REMOTE_SCRIPT_BASE64" \
            '{commands: [("echo \"[ssm] Launching staging deployment script\"; printf %s " + $payload + " | base64 --decode | /bin/bash")]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$STAGING_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$REMOTE_COMMANDS" \
            --region "$DEPLOY_AWS_REGION" \
            --comment "Deploy test-${GITHUB_SHA} to staging" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."

          INVOCATION=""
          STATUS=""
          for attempt in $(seq 1 120); do
            if CURRENT_INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$STAGING_EC2_INSTANCE_ID" \
              --region "$DEPLOY_AWS_REGION" \
              --output json 2>&1); then
              INVOCATION="$CURRENT_INVOCATION"
              STATUS=$(jq -r '.Status' <<<"$INVOCATION")
              case "$STATUS" in
                Success|Failed|TimedOut|Cancelled)
                  break
                  ;;
              esac
            fi
            if [ $((attempt % 6)) -eq 0 ]; then
              echo "Still waiting for SSM deployment (status: ${STATUS:-not available})..."
            fi
            sleep 5
          done

          if [ -z "$INVOCATION" ]; then
            echo "SSM did not return invocation details within 10 minutes" >&2
            exit 1
          fi

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "=== SSM INVOCATION ==="
            jq '{Status, StatusDetails, ResponseCode, ExecutionElapsedTime, ExecutionStartDateTime, ExecutionEndDateTime}' <<<"$INVOCATION"
            echo "=== STDOUT ==="
            STDOUT=$(jq -r '.StandardOutputContent // empty' <<<"$INVOCATION")
            if [ -n "$STDOUT" ]; then printf '%s\n' "$STDOUT"; else echo "<empty: the SSM agent may not have started the script; check ResponseCode above>"; fi
            echo "=== STDERR ==="
            STDERR=$(jq -r '.StandardErrorContent // empty' <<<"$INVOCATION")
            if [ -n "$STDERR" ]; then printf '%s\n' "$STDERR"; else echo "<empty>"; fi
            echo "Deployment failed - see output above"
            exit 1
          fi

          echo "Deployment succeeded and container confirmed running"
