name: deploy-test

on:
  push:
    branches:
      - test

permissions:
  contents: read

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ---- SonarCloud scan (report only, never blocks) ----
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # ---- Trivy filesystem/dependency scan (report only) ----
      - name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: json
          output: trivy-fs-report.json

      - name: Trivy filesystem scan (readable table, for the report bundle)
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-fs-report.txt

      # ---- Snyk scan (report only) ----
      - name: Snyk Scan
        continue-on-error: true
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --json-file-output=snyk-report.json

      # ---- Build the Docker image ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEPLOY_AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build image
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          docker build -t "${ECR_REPOSITORY_URL}:test-${GITHUB_SHA}" .

      # ---- Trivy image scan (report only, the built image itself) ----
      - name: Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY_URL }}:test-${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-image-report.txt

      # ---- Upload all reports as downloadable artifacts ----
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-test-${{ github.sha }}
          path: |
            trivy-fs-report.json
            trivy-fs-report.txt
            trivy-image-report.txt
            snyk-report.json
          if-no-files-found: warn
          retention-days: 30

      # ---- Push to ECR (always runs now, regardless of scan findings) ----
      - name: Push image to ECR
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          docker push "${ECR_REPOSITORY_URL}:test-${GITHUB_SHA}"

      # ---- Deploy to staging via SSM, then wait for and verify the result ----
      - name: Deploy to staging
        env:
          DEPLOY_AWS_REGION: ${{ secrets.DEPLOY_AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          STAGING_EC2_INSTANCE_ID: ${{ secrets.STAGING_EC2_INSTANCE_ID }}
        run: |
          REMOTE_COMMANDS=$(jq -cn \
            --arg region "$DEPLOY_AWS_REGION" \
            --arg repository "$ECR_REPOSITORY_URL" \
            --arg commit "$GITHUB_SHA" \
            '{
              commands: [
                "cd /home/ubuntu/app",
                ("aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin " + $repository),
                ("sudo docker pull " + $repository + ":test-" + $commit),
                ("sudo sed -i \"s|image:.*oneflowe-app:.*|image: " + $repository + ":test-" + $commit + "|\" docker-compose.yml"),
                "sudo docker compose up -d",
                "sleep 15",
                "sudo docker ps --filter name=app-app-1 --filter status=running | grep app-app-1"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$STAGING_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$REMOTE_COMMANDS" \
            --comment "Deploy test-${GITHUB_SHA} to staging" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$STAGING_EC2_INSTANCE_ID" \
            --region "$DEPLOY_AWS_REGION" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$STAGING_EC2_INSTANCE_ID" \
            --region "$DEPLOY_AWS_REGION" \
            --query "Status" --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "=== STDOUT ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$STAGING_EC2_INSTANCE_ID" \
              --region "$DEPLOY_AWS_REGION" \
              --query "StandardOutputContent" --output text
            echo "=== STDERR ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$STAGING_EC2_INSTANCE_ID" \
              --region "$DEPLOY_AWS_REGION" \
              --query "StandardErrorContent" --output text
            echo "Deployment failed - see output above"
            exit 1
          fi

          echo "Deployment succeeded and container confirmed running"
