name: deploy-test

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneflowe-staging-deployment
  cancel-in-progress: false

# The gates run as parallel jobs, so a run takes about as long as the slowest
# of them rather than the sum of all of them (it was ~40 minutes run end to
# end in one job). Typecheck and lint have a job of their own and report in a
# few minutes, so a broken commit is caught without waiting for the test
# suites. `deploy` waits for every gate and for the scans; SonarCloud is
# report-only and staging does not wait for it.
#
# The image is built and scanned while the tests run, but it is pushed to ECR
# only by `deploy`, after every gate has passed, so a failing commit never
# reaches the registry or staging. `deploy` pushes the exact image
# `build-image` scanned, handed over as a run artifact.

jobs:
  checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test:coverage

      # Read by the SonarCloud job.
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The role suites exercise real assignment joins, tenant boundaries, and
  # reporting arithmetic. Run them against a fresh database before an image
  # can reach staging, matching the production deployment gate.
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneflowe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Migrate the throwaway test database
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oneflowe_test
        run: npm run db:migrate:test

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oneflowe_test
        run: |
          set -Eeuo pipefail
          npm run test:integration:coverage 2>&1 | tee integration-run.log
          if ! grep -q "running against oneflowe_test" integration-run.log; then
            echo "Integration suites did not run against the test database." >&2
            exit 1
          fi
          if grep -q "will SKIP" integration-run.log; then
            echo "Integration suites skipped themselves." >&2
            exit 1
          fi

      # Read by the SonarCloud job.
      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration/lcov.info
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The browser suite seeds its own fixtures (tests/e2e/global-setup.ts), so it
  # needs only a freshly migrated database of its own.
  e2e-smoke:
    name: Role smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneflowe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Migrate the throwaway test database
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oneflowe_test
        run: npm run db:migrate:test

      - name: Install Chromium for role smoke tests
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run role deployment smoke tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oneflowe_test
        run: npm run e2e:smoke

      - name: Upload role smoke failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: role-smoke-staging-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # Report-only scans. None of them will block deployment.
  security-scans:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This uses the open-source CLI rather than gitleaks-action, which exits
      # 1 on organization-owned repositories unless a paid GITLEAKS_LICENSE
      # secret is configured. Known false positives live in .gitleaksignore.
      - name: Scan repository history for committed secrets
        continue-on-error: true
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --proto '=https' \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

          "$RUNNER_TEMP/gitleaks" git . \
            --no-banner \
            --redact \
            --exit-code 0 \
            --report-format json \
            --report-path gitleaks-report.json

          # Findings do not fail the run, so surface them where they are seen.
          LEAK_COUNT=$(jq 'length' gitleaks-report.json)

          echo "Secret scan findings: $LEAK_COUNT"

          if [ "$LEAK_COUNT" -gt 0 ]; then
            {
              echo "### Secret scan: $LEAK_COUNT potential secret(s)"
              echo
              echo "Rotate anything real. Record a verified false positive as"
              echo "its fingerprint in .gitleaksignore."
              echo

              jq -r \
                '.[] | "- \(.File) line \(.StartLine) - \(.RuleID)"' \
                gitleaks-report.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The dependency scans read the installed tree, as they did when they
      # ran in the same job as the tests.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Trivy filesystem scan (JSON)
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: json
          output: trivy-fs-report.json

      - name: Trivy filesystem scan (table)
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-fs-report.txt

      - name: Snyk scan
        continue-on-error: true
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --json-file-output=snyk-report.json

      - name: Upload scan reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-test-${{ github.sha }}
          path: |
            gitleaks-report.json
            trivy-fs-report.json
            trivy-fs-report.txt
            snyk-report.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  # Report-only. It needs both coverage reports, so it starts once the two test
  # suites finish, and staging does not wait for it.
  sonarcloud:
    name: SonarCloud scan
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit

      - name: Download integration coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration

      # Its own timeout keeps a slow TypeScript analysis from running on: when
      # it expires the step fails and continue-on-error carries on.
      - name: SonarCloud scan
        continue-on-error: true
        timeout-minutes: 15
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

  build-image:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_exists: ${{ steps.ecr-image.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEPLOY_AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      # Makes rerunning the same workflow safe when ECR tags are immutable.
      # Uses describe-images, the same call deploy-prod already relies on, so
      # this needs no IAM change. Any error is treated as "not present", which
      # falls through to the build and lets the push report the real problem.
      - name: Check whether immutable image already exists
        id: ecr-image
        shell: bash
        env:
          DEPLOY_AWS_REGION: ${{ secrets.DEPLOY_AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          set -Eeuo pipefail

          IMAGE_TAG="test-${GITHUB_SHA}"
          REPOSITORY_NAME="${ECR_REPOSITORY_URL#*/}"

          if aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$DEPLOY_AWS_REGION" \
            >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists; this is a safe workflow rerun."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image $IMAGE_TAG does not exist and will be built."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The standard runner for a private repository has about 14 GB of disk,
      # and the Docker build needs several GB (two copies of node_modules plus
      # .next). When the disk fills, the runner itself dies mid-build and
      # GitHub keeps no log. Remove preinstalled SDKs this pipeline never uses,
      # then record what is left so a future failure shows the numbers. Never
      # blocks the build.
      - name: Free runner disk space before the image build
        if: ${{ steps.ecr-image.outputs.exists != 'true' }}
        continue-on-error: true
        run: |
          echo "Before:"; df -h /; free -m
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          echo "After:"; df -h /; docker system df

      - name: Set up Docker Buildx
        if: ${{ steps.ecr-image.outputs.exists != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layers are cached between runs in the GitHub Actions cache, so an
      # unchanged lockfile skips the dependency install. The Alpine security
      # upgrade is keyed to this run (SECURITY_UPGRADE_KEY in the Dockerfile)
      # and is never served from the cache.
      - name: Build image
        if: ${{ steps.ecr-image.outputs.exists != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: ${{ secrets.ECR_REPOSITORY_URL }}:test-${{ github.sha }}
          build-args: |
            SECURITY_UPGRADE_KEY=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=oneflowe-staging-image
          cache-to: type=gha,scope=oneflowe-staging-image,mode=max

      # On a workflow rerun, pull the existing immutable image so Trivy
      # can scan the exact image that will be deployed.
      - name: Pull existing immutable image for scanning
        if: ${{ steps.ecr-image.outputs.exists == 'true' }}
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          set -Eeuo pipefail
          docker pull "${ECR_REPOSITORY_URL}:test-${GITHUB_SHA}"

      # Report-only scan. It will not block deployment.
      - name: Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY_URL }}:test-${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-image-report.txt

      - name: Upload image scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-report-test-${{ github.sha }}
          path: trivy-image-report.txt
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      # Hands the scanned image to `deploy`, which pushes it only once every
      # gate has passed.
      - name: Save image for the deploy job
        if: ${{ steps.ecr-image.outputs.exists != 'true' }}
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          set -Eeuo pipefail
          docker save "${ECR_REPOSITORY_URL}:test-${GITHUB_SHA}" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
          ls -lh "$RUNNER_TEMP/image.tar.gz"

      - name: Upload image for the deploy job
        if: ${{ steps.ecr-image.outputs.exists != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-test-${{ github.sha }}
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  deploy:
    name: Deploy to staging
    needs: [checks, unit-tests, integration-tests, e2e-smoke, security-scans, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEPLOY_AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      # Checked again here, not taken from build-image: re-running only this
      # job after an earlier attempt pushed the image must not try to push an
      # immutable tag twice.
      - name: Check whether immutable image already exists
        id: ecr-image
        shell: bash
        env:
          DEPLOY_AWS_REGION: ${{ secrets.DEPLOY_AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          set -Eeuo pipefail

          IMAGE_TAG="test-${GITHUB_SHA}"
          REPOSITORY_NAME="${ECR_REPOSITORY_URL#*/}"

          if aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$DEPLOY_AWS_REGION" \
            >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists; nothing to push."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the scanned image
        if: ${{ steps.ecr-image.outputs.exists != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: image-test-${{ github.sha }}
          path: ${{ runner.temp }}/image

      # Skip this step on a safe rerun because the immutable image exists.
      - name: Push immutable image to ECR
        if: ${{ steps.ecr-image.outputs.exists != 'true' }}
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          set -Eeuo pipefail
          gunzip -c "$RUNNER_TEMP/image/image.tar.gz" | docker load
          docker push "${ECR_REPOSITORY_URL}:test-${GITHUB_SHA}"

      - name: Deploy to staging through SSM
        env:
          DEPLOY_AWS_REGION: ${{ secrets.DEPLOY_AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          STAGING_EC2_INSTANCE_ID: ${{ secrets.STAGING_EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail

          ECR_REGISTRY="${ECR_REPOSITORY_URL%%/*}"

          if [ "$ECR_REGISTRY" = "$ECR_REPOSITORY_URL" ]; then
            echo "ECR_REPOSITORY_URL must include the registry host and repository name" >&2
            exit 1
          fi

          REMOTE_BODY=$(cat <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          APP_DIR="/home/ubuntu/app"
          COMPOSE_FILE="$APP_DIR/docker-compose.yml"
          BACKUP_FILE="$APP_DIR/docker-compose.yml.before-deploy"
          NEW_IMAGE="${DEPLOY_REPOSITORY}:test-${DEPLOY_COMMIT}"
          ROLLBACK_ENABLED=false

          rollback_on_error() {
            status=$?
            trap - EXIT

            if [ "$status" -ne 0 ] &&
               [ "$ROLLBACK_ENABLED" = true ] &&
               [ -f "$BACKUP_FILE" ]; then
              echo "[rollback] Deployment failed; restoring the previous Compose configuration" >&2

              set +e

              sudo cp "$BACKUP_FILE" "$COMPOSE_FILE"
              cd "$APP_DIR"

              sudo docker compose up -d app
              sleep 10

              sudo docker compose ps -a >&2
              sudo docker compose logs \
                --no-color \
                --tail=100 \
                app >&2
            fi

            exit "$status"
          }

          trap rollback_on_error EXIT

          echo "[deploy] Validating staging host configuration"

          cd "$APP_DIR"

          test -f "$COMPOSE_FILE"
          test -f .env.production

          if ! sudo grep -Eq \
            '^[[:space:]]*NEXTAUTH_URL=[[:space:]]*[^[:alnum:]]*https://' \
            .env.production; then
            echo "[deploy] NEXTAUTH_URL must use the public staging HTTPS URL" >&2
            exit 20
          fi

          echo "[deploy] Current filesystem usage"

          df -h /
          sudo docker system df || true

          AVAILABLE_KB=$(df -Pk / | awk 'NR == 2 {print $4}')

          # If less than 6 GiB is available, clean unused data before pulling.
          # Docker will protect images referenced by existing containers.
          if [ "$AVAILABLE_KB" -lt 6291456 ]; then
            echo "[deploy] Less than 6 GiB is free; removing unused images and build cache"

            sudo docker image prune -a -f
            sudo docker builder prune -a -f
          fi

          AVAILABLE_KB=$(df -Pk / | awk 'NR == 2 {print $4}')

          # Do not risk filling the disk and breaking Docker or SSM again.
          if [ "$AVAILABLE_KB" -lt 5242880 ]; then
            echo "[deploy] Less than 5 GiB remains after cleanup; refusing to pull a new image" >&2

            df -h / >&2
            sudo docker system df >&2 || true

            exit 22
          fi

          echo "[deploy] Saving rollback configuration"

          sudo cp "$COMPOSE_FILE" "$BACKUP_FILE"
          ROLLBACK_ENABLED=true

          echo "[deploy] Authenticating Docker to ECR"

          aws ecr get-login-password \
            --region "$DEPLOY_REGION" |
            sudo docker login \
              --username AWS \
              --password-stdin \
              "$DEPLOY_REGISTRY"

          echo "[deploy] Pulling $NEW_IMAGE"

          sudo docker pull "$NEW_IMAGE"

          echo "[deploy] Updating Compose to the immutable image"

          sudo sed -i -E \
            "s|^[[:space:]]*image:[[:space:]]*.*oneflowe-app:.*$|    image: $NEW_IMAGE|" \
            "$COMPOSE_FILE"

          sudo grep -Fq \
            "image: $NEW_IMAGE" \
            "$COMPOSE_FILE"

          echo "[deploy] Starting the new application container"

          sudo docker compose up -d app

          DEPLOYMENT_HEALTHY=false

          for attempt in $(seq 1 18); do
            container_id=$(sudo docker compose ps -a -q app)
            running_id=$(sudo docker compose ps --status running -q app)

            echo "[deploy] Health attempt ${attempt}/18"

            if [ -n "$container_id" ] &&
               [ "$container_id" = "$running_id" ] &&
               sudo docker exec "$container_id" node -e \
                 "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              DEPLOYMENT_HEALTHY=true
              break
            fi

            sleep 5
          done

          if [ "$DEPLOYMENT_HEALTHY" != true ]; then
            echo "[deploy] New application did not become healthy" >&2

            sudo docker compose ps -a >&2 || true
            sudo docker compose logs \
              --no-color \
              --tail=200 \
              app >&2 || true

            # Exiting here activates rollback_on_error.
            exit 21
          fi

          echo "[deploy] Staging application is running and healthy"

          # The new application is healthy, so rollback is no longer required.
          ROLLBACK_ENABLED=false
          sudo rm -f "$BACKUP_FILE"

          echo "[deploy] Removing Docker data no longer needed by the healthy deployment"

          # Do not add --volumes. Application volumes must remain protected.
          sudo docker container prune -f || true
          sudo docker image prune -a -f || true
          sudo docker builder prune -a -f || true

          echo "[deploy] Final host status"

          df -h /
          sudo docker system df || true
          sudo docker compose ps -a

          trap - EXIT
          exit 0
          REMOTE_SCRIPT
          )

          REMOTE_SCRIPT=$(printf \
            'DEPLOY_REGION=%q\nDEPLOY_REGISTRY=%q\nDEPLOY_REPOSITORY=%q\nDEPLOY_COMMIT=%q\n' \
            "$DEPLOY_AWS_REGION" \
            "$ECR_REGISTRY" \
            "$ECR_REPOSITORY_URL" \
            "$GITHUB_SHA")

          REMOTE_SCRIPT+=$'\n'
          REMOTE_SCRIPT+="$REMOTE_BODY"

          # Validate the generated remote script before sending it to EC2.
          printf '%s\n' "$REMOTE_SCRIPT" | /bin/bash -n

          # Base64 prevents SSM and shell interpolation from changing the script.
          REMOTE_SCRIPT_BASE64=$(printf '%s\n' "$REMOTE_SCRIPT" |
            base64 --wrap=0)

          REMOTE_COMMANDS=$(jq -cn \
            --arg payload "$REMOTE_SCRIPT_BASE64" \
            '{
              commands: [
                (
                  "echo \"[ssm] Launching staging deployment script\"; printf %s "
                  + $payload
                  + " | base64 --decode | /bin/bash"
                )
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$STAGING_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$REMOTE_COMMANDS" \
            --region "$DEPLOY_AWS_REGION" \
            --timeout-seconds 600 \
            --comment "Deploy test-${GITHUB_SHA} to staging" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for staging deployment to complete"

          INVOCATION=""
          STATUS=""

          for attempt in $(seq 1 120); do
            if CURRENT_INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$STAGING_EC2_INSTANCE_ID" \
              --region "$DEPLOY_AWS_REGION" \
              --output json 2>/dev/null); then

              INVOCATION="$CURRENT_INVOCATION"
              STATUS=$(jq -r '.Status' <<<"$INVOCATION")

              case "$STATUS" in
                Success|Failed|TimedOut|Cancelled)
                  break
                  ;;
              esac
            fi

            if [ $((attempt % 6)) -eq 0 ]; then
              echo "Still waiting for SSM deployment (status: ${STATUS:-not available})"
            fi

            sleep 5
          done

          if [ -z "$INVOCATION" ]; then
            echo "SSM did not return invocation details within 10 minutes" >&2
            exit 1
          fi

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "=== SSM INVOCATION ==="

            jq '{
              Status,
              StatusDetails,
              ResponseCode,
              ExecutionElapsedTime,
              ExecutionStartDateTime,
              ExecutionEndDateTime
            }' <<<"$INVOCATION"

            echo "=== STDOUT ==="

            STDOUT=$(jq -r \
              '.StandardOutputContent // empty' \
              <<<"$INVOCATION")

            if [ -n "$STDOUT" ]; then
              printf '%s\n' "$STDOUT"
            else
              echo "<empty: SSM may not have started the script>"
            fi

            echo "=== STDERR ==="

            STDERR=$(jq -r \
              '.StandardErrorContent // empty' \
              <<<"$INVOCATION")

            if [ -n "$STDERR" ]; then
              printf '%s\n' "$STDERR"
            else
              echo "<empty>"
            fi

            exit 1
          fi

          echo "Deployment succeeded and the staging container is healthy"

      # Optional complete-path check through the staging domain, ALB and WAF.
      # Add a GitHub repository variable called STAGING_HEALTH_URL to enable it.
      - name: Verify public staging endpoint
        if: ${{ vars.STAGING_HEALTH_URL != '' }}
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$STAGING_HEALTH_URL"
