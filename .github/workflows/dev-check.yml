name: dev-check

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGPOOL_MAX: ${{ secrets.PGPOOL_MAX }}
      PGPOOL_CONN_TIMEOUT_MS: ${{ secrets.PGPOOL_CONN_TIMEOUT_MS }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      NNAWS_ACCESS_KEY_ID: ${{ secrets.NNAWS_ACCESS_KEY_ID }}
      NAWS_SECRET_ACCESS_KEY: ${{ secrets.NAWS_SECRET_ACCESS_KEY }}
      SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
      SES_CONFIGURATION_SET: ${{ secrets.SES_CONFIGURATION_SET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      # Report-only scan. Uses the open-source CLI rather than
      # gitleaks-action, which exits 1 on organization-owned repositories
      # unless a paid GITLEAKS_LICENSE secret is configured. That failure was
      # aborting this job before any of the checks below could run. Known
      # false positives live in .gitleaksignore.
      - name: Scan repository history for committed secrets
        continue-on-error: true
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

          "$RUNNER_TEMP/gitleaks" git . \
            --no-banner \
            --redact \
            --exit-code 0 \
            --report-format json \
            --report-path gitleaks-report.json

          LEAK_COUNT=$(jq 'length' gitleaks-report.json)

          echo "Secret scan findings: $LEAK_COUNT"

          if [ "$LEAK_COUNT" -gt 0 ]; then
            {
              echo "### Secret scan: $LEAK_COUNT potential secret(s)"
              echo
              jq -r \
                '.[] | "- \(.File) line \(.StartLine) - \(.RuleID)"' \
                gitleaks-report.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
