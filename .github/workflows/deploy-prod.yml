name: deploy-prod

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # JOB 1 - Runs immediately on push. Scans, builds, pushes the
  # image to ECR, generates a PDF report, and emails it.
  # Does NOT deploy anything yet.
  # ============================================================
  build-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ---- SonarCloud scan (report only) ----
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # ---- Trivy filesystem/dependency scan ----
      - name: Trivy filesystem scan (JSON)
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: json
          output: trivy-fs-report.json

      - name: Trivy filesystem scan (table)
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-fs-report.txt

      # ---- Snyk scan ----
      - name: Snyk Scan
        continue-on-error: true
        uses: snyk/actions/node@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --json-file-output=snyk-report.json

      # ---- Build the Docker image ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEPLOY_AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build image
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          docker build -t "${ECR_REPOSITORY_URL}:prod-${GITHUB_SHA}" .

      # ---- Trivy image scan ----
      - name: Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY_URL }}:prod-${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-image-report.txt

      # ---- Generate the PDF report ----
      - name: Generate PDF report
        env:
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          bash .github/scripts/generate-report.sh "${{ github.sha }}"

      # ---- Upload everything as downloadable artifacts ----
      - name: Upload scan reports and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-prod-${{ github.sha }}
          path: |
            trivy-fs-report.json
            trivy-fs-report.txt
            trivy-image-report.txt
            snyk-report.json
            pipeline-report-${{ github.sha }}.pdf
          if-no-files-found: warn
          retention-days: 90

      # ---- Push image to ECR (ready and waiting for approval) ----
      - name: Push image to ECR
        env:
          DEPLOY_AWS_REGION: ${{ secrets.DEPLOY_AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          if aws ecr describe-images --repository-name oneflowe-app --region "$DEPLOY_AWS_REGION" --image-ids "imageTag=prod-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Image tag prod-${GITHUB_SHA} already exists in ECR (likely a re-run on the same commit) - skipping push."
          else
            docker push "${ECR_REPOSITORY_URL}:prod-${GITHUB_SHA}"
          fi

      # ---- Email the PDF report ----
      - name: Email pipeline report
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "OneFlower Production Deployment Report - Approval Needed (${{ github.sha }})"
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: OneFlower CI/CD
          body: |
            A new production deployment is ready and waiting for approval.

            Commit: ${{ github.sha }}
            Repository: ${{ github.repository }}

            The full scan report is attached as a PDF.

            To approve or reject this deployment, go to:
            https://github.com/${{ github.repository }}/actions

            Find the pending "deploy-prod" workflow run and click "Review deployments".
          attachments: pipeline-report-${{ github.sha }}.pdf

  # ============================================================
  # JOB 2 - Gated behind the "production-approval" environment.
  # Pauses here until a required reviewer approves. Only then
  # does it pull the already-built image and deploy it.
  # ============================================================
  deploy:
    needs: build-and-report
    runs-on: ubuntu-latest
    permissions: {}
    environment: production-approval
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEPLOY_AWS_REGION }}

      - name: Deploy to production via SSM, then wait for and verify the result
        env:
          DEPLOY_AWS_REGION: ${{ secrets.DEPLOY_AWS_REGION }}
          DEPLOY_COMMIT_SHA: ${{ needs.build-and-report.outputs.commit_sha }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          PROD_EC2_INSTANCE_ID: ${{ secrets.PROD_EC2_INSTANCE_ID }}
        run: |
          REMOTE_COMMANDS=$(jq -cn \
            --arg region "$DEPLOY_AWS_REGION" \
            --arg repository "$ECR_REPOSITORY_URL" \
            --arg commit "$DEPLOY_COMMIT_SHA" \
            '{
              commands: [
                "cd /home/ubuntu/app",
                ("aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin " + $repository),
                ("sudo docker pull " + $repository + ":prod-" + $commit),
                ("sudo sed -i \"s|image:.*oneflowe-app:.*|image: " + $repository + ":prod-" + $commit + "|\" docker-compose.yml"),
                "sudo docker compose up -d",
                "sleep 15",
                "sudo docker ps --filter name=app-app-1 --filter status=running | grep app-app-1"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$PROD_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$REMOTE_COMMANDS" \
            --comment "Deploy prod-${DEPLOY_COMMIT_SHA} to production (approved)" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$PROD_EC2_INSTANCE_ID" \
            --region "$DEPLOY_AWS_REGION" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$PROD_EC2_INSTANCE_ID" \
            --region "$DEPLOY_AWS_REGION" \
            --query "Status" --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "=== STDOUT ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$PROD_EC2_INSTANCE_ID" \
              --region "$DEPLOY_AWS_REGION" \
              --query "StandardOutputContent" --output text
            echo "=== STDERR ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$PROD_EC2_INSTANCE_ID" \
              --region "$DEPLOY_AWS_REGION" \
              --query "StandardErrorContent" --output text
            echo "Deployment failed - see output above"
            exit 1
          fi

          echo "Deployment succeeded and container confirmed running"
