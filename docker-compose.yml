services:
  app:
    image: 969913181802.dkr.ecr.ap-southeast-1.amazonaws.com/oneflowe-app:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
